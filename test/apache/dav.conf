LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so

DavLockDB /var/lib/dav/lockdb
# Served under a prefix so hrefs carry the base URL's path.
Alias /dav /srv/dav
<Directory /srv/dav>
    Dav On
    DavDepthInfinity On
    AuthType Basic
    AuthName webdav
    AuthUserFile /etc/apache2/dav.passwd
    Require valid-user
</Directory>
