# gdbm fails instead of waiting when another process holds the lock DB, so
# serve from a single worker. KeepAlive would let one idle connection hold it.
KeepAlive Off
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    ServerLimit 1
    MaxRequestWorkers 1
</IfModule>
